name: OpenShift Deployer
description: OpenShift deployer
branding:
  icon: package
  color: blue

inputs:
  ### Required
  file:
    description: |
      Template file
      Example frontend/openshift.deploy.yml
    required: true
  oc_namespace:
    description: |
      OpenShift namespace
      Example: abc123-dev, abc123-test, abc123-prod
    required: true
    pattern: "^[a-z0-9]{6}-(dev|test|prod|tools)$"
  oc_server:
    description: |
      OpenShift server URL with port
      Example: https://api.silver.devops.gov.bc.ca:6443
    required: true
    pattern: '^https:\/\/.*:6443$'
  oc_token:
    description: |
      OpenShift access token for authentication
      Should be stored as a GitHub secret
    required: true
    minLength: 32

  ### Typical / recommended
  overwrite:
    description: |
      Replace existing objects/artifacts?
      Example: true, false
    default: true
    type: boolean
  parameters:
    description: |
      Template parameters/variables to pass
      Example: -p ZONE=1234
  timeout:
    description: |
      Timeout for deployment
      Example: 30s, 10m, 1h
    default: "15m"
  triggers:
    description: |
      Omit to always build, otherwise trigger by path
      Example: ('./backend/', './frontend/)
  lite_mode:
    description: |
      Apply 'lite mode' modifications (scaling down, removing PDBs) for pull requests?
      Example: true, false
    default: ${{ github.event.pull_request != '' }}
    type: boolean
  debug:
    description: |
      Enable debug logging?
      Example: true, false
    default: false
    type: boolean

  ### Usually a bad idea / not recommended
  ref:
    description: |
      Branch to diff against
      Example: main
    default: ${{ github.event.repository.default_branch }}
  oc_version:
    description: |
      Override default OpenShift CLI (oc) version
      Example: 4.16
    pattern: '^4\.[0-9]+$'
  repository:
    description: |
      Specify a different repo to clone
      Example: bcgov/quickstart-openshift
    default: ${{ github.repository }}
    pattern: "^[a-zA-Z0-9-_]+/[a-zA-Z0-9-_]+$"
  github_token:
    description: |
      Specify token (GH or PAT), instead of inheriting one from the calling workflow
    default: ${{ github.token }}
  oc_login_attempts:
    description: |
      Maximum number of connection retry attempts for logging into OpenShift
      Example: 5, 10
    default: "5"
    pattern: "^[1-9][0-9]*$"

outputs:
  triggered:
    description: Did a deployment trigger?  [true|false]
    value: ${{ steps.triggers.outputs.triggered }}

runs:
  using: composite
  steps:
    - name: Context Diagnostics
      if: inputs.debug
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        IS_PULL_REQUEST: ${{ github.event.pull_request != '' }}
        BASE_REF: ${{ github.base_ref }}
        LITE_MODE: ${{ inputs.lite_mode }}
        DEBUG: ${{ inputs.debug }}
      run: |
        echo "---- CONTEXT DIAGNOSTICS ----"
        echo "Event Name:   ${EVENT_NAME}"
        echo "Pull Request: ${IS_PULL_REQUEST}"
        echo "Base Ref:     ${BASE_REF}"
        echo "Lite Mode:    ${LITE_MODE}"
        echo "Debug Mode:   ${DEBUG}"
        echo "---------------------------"

    # Send triggers to diff action
    - id: triggers
      uses: bcgov/action-diff-triggers@a80e4b3cf77b7e05f84e74030e3bfa08b717a574 # v1.2.1
      with:
        triggers: ${{ inputs.triggers }}
        ref: ${{ inputs.ref }}
        github_token: ${{ inputs.github_token }}

    - name: Validate oc login retry inputs
      if: steps.triggers.outputs.triggered == 'true'
      shell: bash
      env:
        OC_LOGIN_ATTEMPTS: ${{ inputs.oc_login_attempts }}
      run: |
        if ! [[ "${OC_LOGIN_ATTEMPTS}" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::oc_login_attempts must be a positive integer"
          exit 1
        fi

    - if: inputs.oc_version != '' && steps.triggers.outputs.triggered == 'true'
      uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
      with:
        oc_namespace: ${{ inputs.oc_namespace }}
        oc_token: ${{ inputs.oc_token }}
        oc_server: ${{ inputs.oc_server }}
        oc_version: ${{ inputs.oc_version }}
        repository: ${{ inputs.repository }}
        triggers: ${{ inputs.triggers }}
        github_token: ${{ inputs.github_token }}
        login_attempts: ${{ inputs.oc_login_attempts }}

    - if: inputs.oc_version == '' && steps.triggers.outputs.triggered == 'true'
      uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
      with:
        oc_namespace: ${{ inputs.oc_namespace }}
        oc_token: ${{ inputs.oc_token }}
        oc_server: ${{ inputs.oc_server }}
        repository: ${{ inputs.repository }}
        triggers: ${{ inputs.triggers }}
        github_token: ${{ inputs.github_token }}
        login_attempts: ${{ inputs.oc_login_attempts }}

    - name: Process template
      if: steps.triggers.outputs.triggered == 'true'
      shell: bash
      # Inputs travel through the environment, never through `${{ }}` inside the
      # script body.  Actions substitutes `${{ }}` into the script text before
      # bash parses it, so any $, ` or $() in a value is expanded or executed.
      # A secret mangled that way no longer matches what GitHub registered for
      # masking, so the runner cannot redact it.  See the README, "Passing
      # secrets as parameters".
      env:
        ACTION_PATH: ${{ github.action_path }}
        TEMPLATE_FILE: ${{ inputs.file }}
        PARAMETERS: ${{ inputs.parameters }}
        LITE_MODE: ${{ inputs.lite_mode }}
        DEBUG: ${{ inputs.debug }}
      run: |
        WORK_DIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        TEMPLATE="${WORK_DIR}/oc-template.json"
        umask 077

        # Split `parameters` into argv and mask sensitive values
        PARAM_ARGS=()
        "${ACTION_PATH}/scripts/parse-parameters.sh" "${WORK_DIR}/oc-params.nul"
        while IFS= read -r -d '' arg; do
          PARAM_ARGS+=("${arg}")
        done < "${WORK_DIR}/oc-params.nul"
        rm -f "${WORK_DIR}/oc-params.nul"

        # Print object kinds and names only; rendered objects carry parameter
        # values, so the full template must never be echoed.
        template_summary() {
          jq -r '[.items[] | {
            kind: .kind,
            name: .metadata.name,
            replicas: (.spec.replicas // null),
            strategy: (.spec.strategy.type // null)
          }]' "${TEMPLATE}"
        }

        # Process template and variables
        if [ "${#PARAM_ARGS[@]}" -gt 0 ]; then
          oc process --local -f "${TEMPLATE_FILE}" "${PARAM_ARGS[@]}" > "${TEMPLATE}"
        else
          oc process --local -f "${TEMPLATE_FILE}" > "${TEMPLATE}"
        fi

        # Check for deprecated DeploymentConfig objects
        DC_COUNT=$(jq '[.items[] | select(.kind=="DeploymentConfig")] | length' "${TEMPLATE}")
        if [ "${DC_COUNT}" -gt 0 ]; then
          echo "Error: DeploymentConfig objects are deprecated and no longer supported. Please use Deployment objects instead."
          exit 1
        fi

        # Clean any previous ImageStreams
        for name in $(jq -r '.items[] | select(.kind=="ImageStream").metadata.name' "${TEMPLATE}"); do
          oc delete imagestream "${name}" --ignore-not-found
        done

        # Apply lite mode modifications for pull requests if triggered
        if [ "${LITE_MODE}" = "true" ]; then
          if [ "${DEBUG}" = "true" ]; then
            echo "DEBUG: Template objects BEFORE lite mode modifications:"
            template_summary
          fi

          echo "Applying lite mode modifications"
          # Replace strategy entirely: Recreate forbids a leftover rollingUpdate block.
          jq '
            .items |= map(select(.kind != "HorizontalPodAutoscaler" and .kind != "PodDisruptionBudget")) |
            .items |= map(
              if .kind == "Deployment"
              then .spec.replicas = 1 | .spec.strategy = {"type": "Recreate"}
              else .
              end
            )' "${TEMPLATE}" > "${WORK_DIR}/oc-template-lite.json"

          if [ -s "${WORK_DIR}/oc-template-lite.json" ]; then
            mv "${WORK_DIR}/oc-template-lite.json" "${TEMPLATE}"
          else
            rm -f "${WORK_DIR}/oc-template-lite.json"
            echo "::error::Failed to apply lite mode modifications (jq output was empty)"
            exit 1
          fi

          if [ "${DEBUG}" = "true" ]; then
            echo "DEBUG: Template objects AFTER lite mode modifications:"
            template_summary
          fi
        fi

        # Hand the rendered template to the next step as a path.  The objects
        # contain every parameter value, so they must not go into GITHUB_ENV,
        # which would expose them to every later step in the job -- and whose
        # heredoc framing can be broken by template content.
        echo "TEMPLATE_PATH=${TEMPLATE}" >> "${GITHUB_ENV}"

    - name: Deploy
      if: steps.triggers.outputs.triggered == 'true'
      shell: bash
      env:
        OVERWRITE: ${{ inputs.overwrite }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        if [ "${OVERWRITE}" != "false" ]; then
          echo "Overwrite=true; using oc apply"
          oc apply --timeout="${TIMEOUT:-15m}" -f "${TEMPLATE_PATH}"
        else
          # Allow AlreadyExists errors and expected failures
          echo "Overwrite=false; using oc create"
          (set +o pipefail; oc create -f "${TEMPLATE_PATH}" 2>&1 | sed 's/.*: //')
        fi

        # Follow any active deployments
        DEPLOYMENT=$(jq -r '.items[] | select(.kind=="Deployment").metadata.name //empty' "${TEMPLATE_PATH}")
        if [ -n "${DEPLOYMENT}" ] && [ -n "$(oc get deployment "${DEPLOYMENT}" -o name --ignore-not-found)" ]; then
          oc rollout status "deployment/${DEPLOYMENT}" -w
        fi

    # Action repo needs to be present for cleanup/tests
    - name: Checkout local repo to make sure action.yml is present
      if: github.repository != inputs.repository
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.github_token }}
